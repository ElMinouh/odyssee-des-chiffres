name: CI

# Filet de sécurité automatique : lance les 182 tests Vitest et le lint ESLint
# à chaque push / pull request. Ne remplace pas le déploiement manuel existant
# (toujours fait par Cyril), c'est un contrôle en plus, pas un changement de process.
# Voir ADR-52 (ADR.md) pour le contexte de cette décision.

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Pas de "cache: npm" : ça exige un package-lock.json, or le dépôt
          # l'exclut volontairement (_gitignore) — voir étape suivante.

      - name: Installer les dépendances
        # npm install (pas npm ci) : le dépôt ignore volontairement package-lock.json
        # (_gitignore), donc aucun lockfile n'est disponible à commit.
        run: npm install --no-audit --no-fund

      - name: Lancer les tests (Vitest)
        run: npm test

      - name: Lancer le lint (ESLint)
        run: npm run lint
